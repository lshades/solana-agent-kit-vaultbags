# Publish to npm with provenance, using trusted publishing (OIDC).
#
# No npm token is stored anywhere. Trusted publishing exchanges this workflow's
# OIDC identity for short-lived credentials and attaches a provenance
# attestation, so the published package carries a publicly verifiable link back
# to the exact commit it was built from.
#
# That matters here because this package is installed INSIDE other people's
# agents. Until now every release was published by hand, which means the only
# thing standing between a stolen credential and a malicious version was a
# credential. This removes the credential.
#
# One-time setup on npmjs.com: Package settings -> Trusted publisher ->
# GitHub Actions, with this repository and this workflow filename.
# On GitHub: Settings -> Environments -> npm-publish -> Required reviewers, so a
# pushed tag waits for an approval before the job that can publish runs.
#
# Release: push a tag like v0.2.5 matching the version in package.json, on a
# commit that is already on master.

name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Everything that decides whether this commit may be released runs here, in a
  # job that cannot obtain publishing credentials (no id-token).
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions are pinned to full commit SHAs, not tags: a tag can be moved to
      # other code. Verified 2026-09-26: each commit is the one its release tag
      # names, is signed, and is contained in its repository's main branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so the tagged commit can be found on master.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # A tag can be pushed on any commit, including one that never went through
      # master. Only a released commit that master already contains is published.
      - name: The tagged commit must be on master
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "the tag points at $GITHUB_SHA, which is not on master"
            exit 1
          fi

      # There is no dependency install step on purpose: this package declares
      # only peer dependencies, so nothing is fetched that could substitute code
      # between the tag and the publish. The test suite needs none of them: it
      # imports the client (node built-ins only) and reads index.js as text.
      - run: npm test

      # Every .js the manifest ships, so a new module is covered without editing
      # this step. node --check parses ESM here because package.json declares
      # "type": "module" (without that field it exits 0 on a syntax error).
      - name: Shipped files must parse
        run: |
          node -e "
            for (const f of require('./package.json').files.filter((f) => f.endsWith('.js'))) {
              require('child_process').execFileSync(process.execPath, ['--check', f], { stdio: 'inherit' });
              console.log('parsed ' + f);
            }
          "

      - name: Every file the manifest promises must exist
        run: |
          node -e "
            const fs = require('fs');
            const missing = require('./package.json').files.filter((f) => !fs.existsSync(f));
            if (missing.length) { console.error('missing: ' + missing.join(', ')); process.exit(1); }
            console.log('all declared files present');
          "

      # The tag and the manifest must agree, or a release can quietly publish a
      # version nobody tagged.
      - name: Tag must match package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $TAG does not match package.json $PKG"
            exit 1
          fi

  publish:
    needs: check
    runs-on: ubuntu-latest
    # Approval gate: configure required reviewers for this environment on GitHub.
    environment: npm-publish
    permissions:
      contents: read
      # Required for trusted publishing: it is what proves to npm which workflow,
      # in which repository, at which commit is asking to publish.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after the checkout needs git credentials.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24 bundles npm 11, which trusted publishing needs (11.5.1 or
          # later), so no npm is downloaded inside the job that can publish.
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Fail loudly rather than publish without trusted publishing.
      - name: npm must support trusted publishing (11.5.1 or later)
        run: |
          node -e "
            const [a, b, c] = require('child_process').execSync('npm -v').toString().trim().split('.').map(Number);
            if (!(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))))) {
              console.error('npm ' + [a, b, c].join('.') + ' is older than 11.5.1');
              process.exit(1);
            }
          "

      - run: npm publish
